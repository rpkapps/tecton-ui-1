# domain_map.yaml
# Provenance for the @tecton/react Agent Skills (TanStack Intent).
# Library: @tecton/react
# Version: 0.0.0
# Date: 2026-09-19
# Status: reviewed
#
# Regenerate skill_tree.yaml from the SKILL.md files after editing:
#   pnpm --filter @tecton/react skills:sync

library:
  name: '@tecton/react'
  version: '0.0.0'
  repository: 'https://github.com/rpkapps/tecton-ui-1'
  description: 'Enterprise React design system for Tecton — shadcn/ui on the React Aria base, themed through Tecton tokens.'
  primary_framework: 'React'

domains:
  - name: 'Project wiring'
    slug: 'wiring'
    description: 'Getting the package, the stylesheet and the guardrails into an application so the theme resolves at all.'
  - name: 'Visual language'
    slug: 'visual-language'
    description: 'Colour, token and class decisions — what the design system owns versus what the application may set.'
  - name: 'Component surface'
    slug: 'component-surface'
    description: 'Which component to reach for, and the React Aria API shape it exposes.'
  - name: 'Composition'
    slug: 'composition'
    description: 'Assembling components into forms, tables, pages and application frames.'

skills:
  - name: 'Tecton core'
    slug: 'tecton-core'
    domain: 'component-surface'
    description: 'Routing hub: the import surface, the three facts that drive most mistakes, and the sub-skill table.'
    type: 'core'
    packages: ['@tecton/react']
    covers:
      - 'import surface (@tecton/react/components/*, /tecton/*, /icons)'
      - 'React Aria base versus Radix'
      - 'deleted stock Tailwind palette'
      - 'variants own the look'
    tasks:
      - 'Start any work in a Tecton application'
      - 'Decide which sub-skill applies'
    failure_modes:
      - mistake: 'Importing a component from a components/ui/ path'
        mechanism: 'A components/ui/ file is a stock Radix component from the public registry, with a palette Tecton has deleted.'
        source: 'apps/www/content/docs/linting.mdx; packages/eslint-config-tecton/index.js'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Stock Tailwind colour classes that render nothing'
        mechanism: 'globals.css sets --color-*: initial, so bg-red-500 matches no theme entry and Tailwind emits no rule.'
        source: 'apps/www/content/docs/theming.mdx'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['tecton-core', 'tecton-core/styling']
      - mistake: 'Radix props on a React Aria component'
        mechanism: 'onClick and disabled are not in the react-aria-components prop type; the handler never fires from the keyboard and the control never disables.'
        source: 'packages/tecton-react/src/components/button.tsx'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['tecton-core', 'tecton-core/components']
      - mistake: 'Restyling a component instead of using its variant'
        mechanism: 'Tecton adds variant axes stock shadcn lacks; painting by hand loses the dark-mode pair and the contrast check.'
        source: 'docs/UPSTREAM.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Adding a dark: variant to a palette class'
        mechanism: 'A palette step is a contrast level that already switches value with the mode; a dark: pair inverts the intent.'
        source: 'apps/www/content/docs/theming.mdx'
        priority: 'HIGH'
        status: 'active'
        skills: ['tecton-core', 'tecton-core/styling']
      - mistake: 'Installing components with the shadcn CLI'
        mechanism: 'Only blocks are published to the @tecton registry; shadcn add <name> resolves against the public registry.'
        source: 'README.md; apps/www/content/docs/installation.mdx'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['tecton-core', 'tecton-core/blocks']

  - name: 'Setup'
    slug: 'setup'
    domain: 'wiring'
    description: 'Install the private package, import globals.css once, wire @source, dark mode and the ESLint guardrails.'
    type: 'sub-skill'
    packages: ['@tecton/react']
    covers: ['private package consumption', 'globals.css', '@source', 'dark mode', '@tecton/eslint-config recommended vs strict', 'components.json']
    tasks:
      - 'Add Tecton to a new application'
      - 'Fix unstyled or unthemed output'
      - 'Configure the design-system linter'
    failure_modes:
      - mistake: 'Installing @tecton/react from public npm'
        mechanism: 'The package is private and unpublished; the install fails or resolves to an unrelated package.'
        source: 'apps/www/content/docs/installation.mdx'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Tailwind emits nothing for the application files'
        mechanism: 'globals.css @sources the package and apps/** only; an app elsewhere is never scanned.'
        source: 'apps/www/content/docs/installation.mdx'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'strict config on an app that installs Tecton from a registry'
        mechanism: 'The linter will not read theme sources inside node_modules, so it sees an empty theme and flags every valid Tecton class.'
        source: 'apps/www/content/docs/linting.mdx'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Importing the individual token stylesheets'
        mechanism: 'globals.css orders the palette reset before the ramps; importing by hand reverses it on some bundlers.'
        source: 'apps/www/content/docs/theming.mdx'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Styling'
    slug: 'styling'
    domain: 'visual-language'
    description: 'Semantic tokens, the fifteen-family contrast palette, the scales, and the exact split between className and variant.'
    type: 'sub-skill'
    packages: ['@tecton/react']
    covers: ['semantic tokens', 'palette families and steps', 'contrast-level steps need no dark:', 'allowed vs variant-owned utilities', 'radius/spacing/type scales']
    tasks:
      - 'Pick a colour for a surface, text or border'
      - 'Decide whether a className is legitimate'
      - 'Add a project-specific token'
    reference_candidates:
      - topic: 'palette families and step recipes'
        reason: 'fifteen families x twenty-three steps with mode-dependent values'
    failure_modes:
      - mistake: 'A stock Tailwind colour anywhere in the project'
        mechanism: 'The class matches no theme entry, so no CSS is emitted and the element inherits.'
        source: 'apps/www/content/docs/theming.mdx'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'A hex or arbitrary colour value'
        mechanism: 'It does emit CSS, so it looks right in the mode it was written in and is frozen there with no pair and no contrast check.'
        source: 'apps/www/content/docs/theming.mdx'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: "Overriding a variant's colour or size with className"
        mechanism: 'Height, radius, colour and type size are variant-owned; overrides stop tracking the theme.'
        source: 'packages/eslint-config-tecton/index.js'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Building class names at runtime'
        mechanism: 'Tailwind resolves classes by scanning source text, so an interpolated class is never generated.'
        source: 'packages/eslint-config-tecton/index.js'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'An arbitrary value for spacing, radius or type'
        mechanism: 'Leaves the Tecton scale with no signal; drift only shows next to a component that followed it.'
        source: 'apps/www/content/docs/linting.mdx'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Components'
    slug: 'components'
    domain: 'component-surface'
    description: 'The 59 shadcn modules on the React Aria base, the prop translation table, and the Tecton variant axes.'
    type: 'sub-skill'
    packages: ['@tecton/react']
    covers: ['React Aria prop conventions', 'overlay trigger-wraps-overlay shape', 'id-keyed collections', 'Tecton variant axes on alert/badge/separator/input/textarea/select']
    tasks:
      - 'Add any component to a screen'
      - 'Port stock shadcn code into a Tecton application'
    reference_candidates:
      - topic: 'component index with exports and variant axes'
        reason: '59 modules with distinct export surfaces and variant axes'
    failure_modes:
      - mistake: 'onClick and disabled on a Tecton control'
        mechanism: 'React forwards onClick to the DOM so mouse use appears to work, but keyboard activation never fires and disabled skips the styled state.'
        source: 'packages/tecton-react/src/components/button.tsx'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'asChild to render a component as a link'
        mechanism: 'asChild is a Radix primitive that does not exist here; React forwards it as an unknown attribute and the anchor nests inside a button.'
        source: 'packages/tecton-react/src/components/button.tsx'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'value instead of id on a collection item'
        mechanism: 'React Aria collections are keyed by id; with value no item carries a recognised key and nothing selects.'
        source: 'apps/www/src/examples/tabs-demo.tsx'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Trigger + Content + Portal instead of a wrapping trigger'
        mechanism: 'DropdownMenuContent and DialogContent are not exported; the overlay is the base component and the trigger wraps it.'
        source: 'apps/www/src/examples/dropdown-menu-demo.tsx'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'onCheckedChange and an event-shaped onChange'
        mechanism: 'React Aria passes the new value, not a DOM event; reading e.target.checked yields undefined and uncontrols the input.'
        source: 'packages/tecton-react/src/blocks/login-01/components/login-form.tsx'
        priority: 'HIGH'
        status: 'active'
        skills: ['tecton-core/components', 'tecton-core/forms']
      - mistake: 'Icon-only button without an accessible name'
        mechanism: 'React Aria does not invent a name; the control is announced as "button".'
        source: 'docs/OVERFLOW-RULES.md'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Tecton components'
    slug: 'tecton-components'
    domain: 'component-surface'
    description: 'The Tecton-only components and the decision rule for component versus variant versus application code.'
    type: 'sub-skill'
    packages: ['@tecton/react']
    covers: ['Chip', 'CountBadge', 'Stat', 'Panel', 'Meter', 'TreeView', 'CircularProgress', 'ColorSwatch', 'CopyButton', 'component-vs-variant decision rule']
    tasks:
      - 'Find a component that is not under components/'
      - 'Decide whether to build something new'
    failure_modes:
      - mistake: 'Rebuilding a Tecton component in application code'
        mechanism: 'Status is a variant axis on Badge and Alert; a hand-rolled version loses the mode pair and usually uses a dead stock colour.'
        source: 'README.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Using Badge where the tag is interactive'
        mechanism: 'Badge renders a span with no press handling or focus management, so the close affordance is mouse-only.'
        source: 'packages/tecton-react/src/tecton/chip.tsx'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Card with an absolutely positioned action instead of Panel'
        mechanism: 'PanelActions is an overflow row that collapses and compacts; an absolute button overlaps the title at narrow widths.'
        source: 'docs/OVERFLOW-RULES.md'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'onClick on a Tecton component'
        mechanism: 'Tecton components follow the same React Aria conventions; several also expose a more specific callback.'
        source: 'packages/tecton-react/src/tecton/copy-button.tsx'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Icons'
    slug: 'icons'
    domain: 'visual-language'
    description: 'The Tecton icon set beside Lucide, the data-icon attribute, and why icon sizing belongs to the control.'
    type: 'sub-skill'
    packages: ['@tecton/react']
    covers: ['@tecton/react/icons', 'lucide-react coexistence', 'variant outlined/filled', 'data-icon inline-start/inline-end', 'lucide-compat alias']
    tasks:
      - 'Render an icon in a control'
      - 'Choose between Lucide and the Tecton set'
    failure_modes:
      - mistake: 'Sizing an icon with a Tailwind class inside a control'
        mechanism: "The control's rule is [&_svg:not([class*='size-'])], so any size-* class opts the icon out of the control's sizing."
        source: 'packages/tecton-react/src/components/button.tsx'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Omitting data-icon on an icon beside a label'
        mechanism: 'The control tightens padding only via has-data-[icon=inline-*]; without it the button reads visibly wider.'
        source: 'packages/tecton-react/src/components/button.tsx'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Installing another icon package'
        mechanism: 'A third-party set is drawn to a different grid and sizes itself, ignoring the control.'
        source: 'apps/www/content/docs/icons.mdx'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'Colouring an icon directly'
        mechanism: 'Icons inherit currentColor and the status variants already set it; a stock colour class emits nothing anyway.'
        source: 'packages/tecton-react/src/components/alert.tsx'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Forms'
    slug: 'forms'
    domain: 'composition'
    description: 'Field plus TanStack Form and Zod, and the per-control onChange shapes on the React Aria base.'
    type: 'sub-skill'
    packages: ['@tecton/react']
    covers: ['Field family', 'TanStack Form', 'Zod validation', 'onChange shape per control', 'selectedKey/onSelectionChange with null', 'data-invalid vs aria-invalid']
    tasks:
      - 'Build a form with validation'
      - 'Wire a React Aria control to form state'
    failure_modes:
      - mistake: 'Reading e.target.value from a boolean-valued control'
        mechanism: 'Checkbox, Switch and RadioGroup hand onChange the value directly; e.target is undefined.'
        source: 'apps/www/content/docs/forms/tanstack-form.mdx'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Passing field.handleChange straight to an Input'
        mechanism: 'Input and Textarea wrap real DOM elements, so the whole ChangeEvent is written into form state.'
        source: 'apps/www/src/examples/form-tanstack-demo.tsx'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'onChange on a Select'
        mechanism: 'Selection is reported through onSelectionChange; onChange is not in the prop type so the field keeps its default through submit.'
        source: 'apps/www/content/docs/forms/tanstack-form.mdx'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Only data-invalid or only aria-invalid'
        mechanism: 'data-invalid recolours the label and description; the control border and ring come from aria-invalid.'
        source: 'apps/www/src/examples/form-tanstack-demo.tsx'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Label not wired to the control'
        mechanism: 'Field lays out the parts but generates no ids, so the control is announced with no name.'
        source: 'apps/www/src/examples/field-demo.tsx'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Data tables'
    slug: 'data-tables'
    domain: 'composition'
    description: 'TanStack Table on the shadcn Table, with React Aria selection controls and the Tecton ActionBar for bulk actions.'
    type: 'sub-skill'
    packages: ['@tecton/react']
    covers: ['useReactTable', 'flexRender', 'selection column', 'row actions', 'ActionBar bulk actions', 'sortable headers']
    tasks:
      - 'Build a sortable, filterable, selectable table'
      - 'Add bulk actions to a selection'
    failure_modes:
      - mistake: 'Installing or inventing a DataTable component'
        mechanism: 'data-table is a guide, not a module; folding every variation into one component is what headless UI avoids.'
        source: 'apps/www/content/docs/components/data-table.mdx'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'checked / onCheckedChange in the selection column'
        mechanism: 'The most-copied stock shadcn table snippet is Radix-shaped; neither prop exists, so the checkbox never checks.'
        source: 'apps/www/content/docs/components/data-table.mdx'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Forgetting data-state on a selected row'
        mechanism: 'TableRow styles its selected background from data-state="selected"; without it nothing shows the selection.'
        source: 'apps/www/content/docs/components/data-table.mdx'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'Building a bulk-action toolbar by hand'
        mechanism: 'ActionBar owns placement, transition, the aria-live count and the collapse behaviour.'
        source: 'docs/OVERFLOW-RULES.md'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Layout'
    slug: 'layout'
    domain: 'composition'
    description: 'AppShell, PageHeader, Panel and Canvas, and the measured Overflow system every Tecton action row is built on.'
    type: 'sub-skill'
    packages: ['@tecton/react']
    covers: ['AppShell', 'PageHeader', 'Panel', 'ActionBar', 'Overflow/Toolbar', 'OverflowItem priority and OverflowLabel', 'five collapse stages', 'one row per host']
    tasks:
      - 'Lay out a screen or an application frame'
      - 'Build a toolbar or action row that collapses'
    reference_candidates:
      - topic: 'the full overflow and collapse contract'
        reason: 'a five-stage measured contract with per-control overflow forms'
    failure_modes:
      - mistake: 'A plain flex row instead of an overflow row'
        mechanism: 'A nested div makes the whole group one fixed child, so no item can leave and the row jumps to wrap or clip.'
        source: 'docs/OVERFLOW-RULES.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'An unwrapped control that should collapse'
        mechanism: 'Unwrapped children are fixed by definition; a row of only fixed items cannot collapse at all.'
        source: 'docs/OVERFLOW-RULES.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Adding your own More menu'
        mechanism: 'The row renders its own overflow menu, so a hand-added one gives two More buttons; nothing may exist only in the menu.'
        source: 'docs/OVERFLOW-RULES.md'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'A Toolbar around a tab list'
        mechanism: 'Both claim the arrow keys; a row containing a tab list must be a plain Overflow.'
        source: 'docs/OVERFLOW-RULES.md'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'An icon-only item with no label'
        mechanism: 'label and icon are what the overflow menu renders; without them the menu entry is blank.'
        source: 'docs/OVERFLOW-RULES.md'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Blocks'
    slug: 'blocks'
    domain: 'composition'
    description: 'The @tecton registry blocks — the only registry items — and the copied-versus-imported split.'
    type: 'sub-skill'
    packages: ['@tecton/react']
    covers: ['components.json registry entry', 'shadcn add @tecton/<block>', 'block anatomy page.tsx/components/data.ts', 'copied code is yours, imports are not']
    tasks:
      - 'Scaffold a whole screen'
      - 'Run the shadcn CLI against a Tecton project'
    failure_modes:
      - mistake: 'shadcn add <name> without the @tecton namespace'
        mechanism: 'The CLI resolves against the public registry and writes stock Radix components with a deleted palette into components/ui/.'
        source: 'README.md; apps/www/content/docs/installation.mdx'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Treating a copied block as library code'
        mechanism: 'A block does not update and nothing re-copies over it; its imports are the library, the composition is yours.'
        source: 'packages/tecton-react/src/blocks/README.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: "Copying a block's components into components/ui/"
        mechanism: 'Extracting a component forks it from the design system, and the linter flags every import from that path.'
        source: 'packages/eslint-config-tecton/index.js'
        priority: 'MEDIUM'
        status: 'active'

tensions:
  - name: 'Guardrails scope versus real breakage'
    skills: ['setup', 'styling']
    description: 'recommended only inspects Tecton components, but the dead-palette failure applies to every className in the project.'
    implication: "An agent may assume a clean lint means correct styling, and miss bg-red-500 in the application's own components. strict catches it but is only safe where the stylesheet resolves outside node_modules."
  - name: 'Component convenience versus design-system ownership'
    skills: ['tecton-components', 'data-tables']
    description: 'The library deliberately ships no DataTable and no StatusBadge, because both would freeze decisions that differ per screen.'
    implication: 'An agent optimising for fewer lines builds a local wrapper that duplicates a variant or forks the design system, instead of composing Table + TanStack Table or using Badge variants.'

cross_references:
  - from: 'components'
    to: 'styling'
    reason: 'Reaching for a variant instead of a className is the shared conclusion of both.'
  - from: 'data-tables'
    to: 'layout'
    reason: 'ActionBarActions is an overflow row and follows the layout contract.'
  - from: 'forms'
    to: 'components'
    reason: 'The onChange shapes are a specialisation of the React Aria translation table.'
  - from: 'tecton-components'
    to: 'layout'
    reason: 'Panel, PageHeader and ActionBar are governed by the overflow rules.'
  - from: 'blocks'
    to: 'setup'
    reason: 'Blocks need the components.json registry entry from setup.'

gaps: []

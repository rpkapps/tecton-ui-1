name: Generated components

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the Tecton registry mirror
        run: scripts/registry-mirror.sh setup

      - name: Start the local registry mirror
        shell: bash
        run: |
          set -euo pipefail
          scripts/registry-mirror.sh serve >"${RUNNER_TEMP}/registry-mirror.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/r/index.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/registry-mirror.log"
          exit 1

      - name: Verify generated components
        env:
          REGISTRY_URL: http://127.0.0.1:4000/r
        run: pnpm generated:check

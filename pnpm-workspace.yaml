packages:
  - "apps/*"
  - "packages/*"

# The one list of dependencies whose install scripts may run. pnpm 10.33 ignores
# `allowBuilds` as soon as package.json has a `pnpm.onlyBuiltDependencies` list,
# so builds are configured here and nowhere else.
allowBuilds:
  esbuild: true
  lightningcss: true
  msw: false
  unrs-resolver: true
patchedDependencies:
  '@tanstack/start-static-server-functions@1.167.34': patches/@tanstack__start-static-server-functions@1.167.34.patch

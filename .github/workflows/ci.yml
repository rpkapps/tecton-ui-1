name: CI

on:
  pull_request:
  push:
    branches:
      - fix/tecton-portal-context-upstream
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verifies the shadcn-generated components still match the aria-tecton registry mirror.
  generated-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the Tecton registry mirror
        run: scripts/registry-mirror.sh setup

      - name: Start the local registry mirror
        shell: bash
        run: |
          set -euo pipefail
          scripts/registry-mirror.sh serve >"${RUNNER_TEMP}/registry-mirror.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/r/index.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/registry-mirror.log"
          exit 1

      - name: Verify generated components
        env:
          REGISTRY_URL: http://127.0.0.1:4000/r
        run: pnpm generated:check

  # Builds @tecton/react, typechecks, lints, tests and verifies the blocks registry output is committed.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Ensure esbuild binary
        run: pnpm --filter @tecton/react exec node -e "require('esbuild')" || pnpm --filter @tecton/react rebuild esbuild

      - name: Build @tecton/react
        run: pnpm --filter @tecton/react build

      - name: Check @tecton/react exports
        run: pnpm --filter @tecton/react exports:check

      - name: Typecheck workspace
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check theme tokens
        run: pnpm tokens:check

      - name: Build blocks registry
        run: pnpm --filter @tecton/blocks registry:build

      - name: Registry output is committed
        run: git diff --exit-code -- apps/www/public/r packages/tecton-blocks/registry.json

      - name: Test @tecton/eslint-config
        run: pnpm --filter @tecton/eslint-config test

  # Builds @tecton/react and prerenders the docs site on every PR (slower crawl, kept out of `checks`).
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build @tecton/react
        run: pnpm --filter @tecton/react build

      - name: Build www
        run: pnpm --filter www build
